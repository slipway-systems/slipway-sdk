syntax = "proto3";

package slipway.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "slipway/v1/common.proto";

// SecretService manages encrypted and externally-referenced secrets, their versions, the org keyring (KEK/DEK) and
// the connections to external secret managers. Secret values are write-only: no RPC ever returns a stored value.
// The org is derived from the auth context. IDs are prefixed (`sec_…`); provider connections are addressed by name.

enum SecretScope {
  SECRET_SCOPE_UNSPECIFIED = 0;
  SECRET_SCOPE_ORG = 1;
  SECRET_SCOPE_PROJECT = 2;
  SECRET_SCOPE_ENVIRONMENT = 3;
}

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  SECRET_KIND_STATIC = 1;       // value encrypted at rest with the org DEK
  SECRET_KIND_EXTERNAL_REF = 2; // value resolved at use time from an external manager
}

// Secret is metadata only; the value is never returned.
message Secret {
  string id = 1;
  SecretScope scope = 2;
  string project_id = 3;
  string environment_id = 4;
  string name = 5; // env-var style, [A-Za-z_][A-Za-z0-9_]*
  string description = 6;
  SecretKind kind = 7;
  int32 current_version = 8;
  string external_ref = 9; // set when kind == EXTERNAL_REF, e.g. vault://prod/secret/app#password
  repeated string allowed_pipelines = 10;    // empty = any pipeline; entries match pipeline id or name (glob)
  repeated string allowed_environments = 11; // empty = any environment; entries match environment id or name (glob)
  google.protobuf.Timestamp last_used_at = 12;
  string created_by = 13;
  string updated_by = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message SecretVersion {
  int32 version = 1;
  SecretKind kind = 2;
  string external_ref = 3;
  string comment = 4;
  int32 restored_from = 5; // non-zero when this version is a rollback copy of an earlier one
  bool current = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  bool encrypted_with_retired_key = 9; // true until lazily or explicitly re-encrypted under the active DEK
}

message ListSecretsRequest {
  PageRequest page = 1;
  SecretScope scope = 2;
  string project_id = 3;
  string environment_id = 4;
  SecretKind kind = 5;
  string name_prefix = 6;
}
message ListSecretsResponse { repeated Secret items = 1; PageResponse page = 2; }

message GetSecretRequest { string id = 1; }
message GetSecretResponse { Secret secret = 1; }

message CreateSecretRequest {
  SecretScope scope = 1;
  string project_id = 2;
  string environment_id = 3;
  string name = 4;
  string description = 5;
  SecretKind kind = 6;
  string value = 7;        // STATIC only
  string external_ref = 8; // EXTERNAL_REF only
  repeated string allowed_pipelines = 9;
  repeated string allowed_environments = 10;
  string comment = 11;
}

// UpdateSecretRequest: update_mask paths may be description, allowed_pipelines, allowed_environments, value,
// external_ref. Changing value or external_ref creates a new version.
message UpdateSecretRequest {
  string id = 1;
  string description = 2;
  string value = 3;
  string external_ref = 4;
  repeated string allowed_pipelines = 5;
  repeated string allowed_environments = 6;
  string comment = 7;
  google.protobuf.FieldMask update_mask = 8;
}

message CreateSecretResponse { Secret secret = 1; }
message UpdateSecretResponse { Secret secret = 1; }

message DeleteSecretRequest { string id = 1; }
message DeleteSecretResponse {}

// RotateSecretRequest creates a new version. With new_value set the secret value is replaced; without it the
// current value is re-encrypted under the active DEK (a no-op for external references).
message RotateSecretRequest {
  string id = 1;
  string new_value = 2;
  string new_external_ref = 3;
  string comment = 4;
}

message RotateSecretResponse { Secret secret = 1; }

message ListSecretVersionsRequest { string id = 1; }
message ListSecretVersionsResponse { repeated SecretVersion items = 1; }

message RollbackSecretRequest {
  string id = 1;
  int32 version = 2;
  string comment = 3;
}

message RollbackSecretResponse { Secret secret = 1; }

enum SecretImportFormat {
  SECRET_IMPORT_FORMAT_UNSPECIFIED = 0;
  SECRET_IMPORT_FORMAT_DOTENV = 1;
  SECRET_IMPORT_FORMAT_JSON = 2; // flat object of string values
}

message ImportSecretsRequest {
  SecretScope scope = 1;
  string project_id = 2;
  string environment_id = 3;
  SecretImportFormat format = 4;
  string data = 5;
  bool overwrite = 6; // update existing secrets (new version); otherwise existing names are skipped
  bool dry_run = 7;
  repeated string allowed_pipelines = 8;
  repeated string allowed_environments = 9;
}

message ImportSecretResult {
  string name = 1;
  string status = 2; // created | updated | skipped | invalid
  string message = 3;
}

message ImportSecretsResponse {
  int32 created = 1;
  int32 updated = 2;
  int32 skipped = 3;
  int32 invalid = 4;
  repeated ImportSecretResult results = 5;
}

// SecretProviderField describes one config or credential input for a provider so the UI can render a form.
message SecretProviderField {
  string key = 1;
  string label = 2;
  string description = 3;
  bool required = 4;
  bool secret = 5; // credential: write-only, masked in the UI
  repeated string options = 6;
  string default_value = 7;
}

// SecretProviderType is one supported external secret manager (static catalogue).
message SecretProviderType {
  string id = 1;           // vault | aws_sm | gcp_sm | azure_kv | onepassword | doppler | infisical
  string display_name = 2;
  string scheme = 3;       // ref URI scheme, e.g. vault
  string description = 4;
  string ref_format = 5;   // e.g. vault://<connection>/<mount>/<path>#<field>
  string ref_example = 6;
  repeated SecretProviderField config_fields = 7;
  repeated SecretProviderField credential_fields = 8;
  repeated string auth_methods = 9;
  bool supports_job_identity = 10; // can authenticate with the job's OIDC token (no stored credentials)
}

// SecretProviderConnection is an org's configured connection to a provider; credentials are never returned.
message SecretProviderConnection {
  string id = 1;
  string name = 2;
  string provider = 3;
  map<string, string> config = 4;
  bool has_credentials = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListSecretProvidersRequest {}
message ListSecretProvidersResponse {
  repeated SecretProviderType types = 1;
  repeated SecretProviderConnection connections = 2;
}

message UpsertSecretProviderRequest {
  string name = 1;
  string provider = 2;
  map<string, string> config = 3;
  map<string, string> credentials = 4; // write-only
}
message UpsertSecretProviderResponse { SecretProviderConnection connection = 1; }
message DeleteSecretProviderRequest { string name = 1; }
message DeleteSecretProviderResponse {}

// TestExternalRefRequest resolves a reference and reports success without returning the value.
message TestExternalRefRequest { string ref = 1; }
message TestExternalRefResponse {
  bool ok = 1;
  string error = 2;
  string provider = 3;
  int32 value_length = 4;
  google.protobuf.Duration latency = 5;
}

// SecretKeyring is the org's key hierarchy summary (no key material).
message SecretKeyring {
  string id = 1;
  string provider = 2; // local | aws_kms | gcp_kms | azure_kv | vault_transit
  string key_ref = 3;
  map<string, string> config = 4;
  bool byok = 5;
  string status = 6;
  int32 rotation_count = 7;
  google.protobuf.Timestamp last_rotated_at = 8;
  int32 active_dek_version = 9;
  int32 dek_count = 10;
  google.protobuf.Timestamp created_at = 11;
}

message GetKeyringRequest {}
message GetKeyringResponse {
  SecretKeyring keyring = 1;
  bool byok_entitled = 2; // plan allows customer-managed keys
  int64 secrets_on_retired_keys = 3;
}

// ConfigureKeyringRequest switches the org to a customer-managed key (BYOK; Team plan and above). All DEKs are
// re-wrapped under the new KEK; secret ciphertexts are untouched.
message ConfigureKeyringRequest {
  string provider = 1;
  string key_ref = 2;
  map<string, string> config = 3;
  map<string, string> credentials = 4; // write-only
}
message ConfigureKeyringResponse { SecretKeyring keyring = 1; int32 deks_rewrapped = 2; }

enum KeyRotationMode {
  KEY_ROTATION_MODE_UNSPECIFIED = 0;
  KEY_ROTATION_MODE_KEK = 1; // rotate the KMS key and re-wrap every DEK (cheap, ciphertexts untouched)
  KEY_ROTATION_MODE_DEK = 2; // mint a new DEK; existing secrets are re-encrypted lazily or via reencrypt
}

message RotateKeyringRequest {
  KeyRotationMode mode = 1;
  bool reencrypt = 2; // DEK mode: also re-encrypt existing secrets now (bounded batch)
}
message RotateKeyringResponse {
  SecretKeyring keyring = 1;
  int32 deks_rewrapped = 2;
  int32 secrets_reencrypted = 3;
  int64 secrets_remaining = 4;
}

service SecretService {
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse);
  rpc RollbackSecret(RollbackSecretRequest) returns (RollbackSecretResponse);
  rpc ImportSecrets(ImportSecretsRequest) returns (ImportSecretsResponse);

  rpc ListSecretProviders(ListSecretProvidersRequest) returns (ListSecretProvidersResponse);
  rpc UpsertSecretProvider(UpsertSecretProviderRequest) returns (UpsertSecretProviderResponse);
  rpc DeleteSecretProvider(DeleteSecretProviderRequest) returns (DeleteSecretProviderResponse);
  rpc TestExternalRef(TestExternalRefRequest) returns (TestExternalRefResponse);

  rpc GetKeyring(GetKeyringRequest) returns (GetKeyringResponse);
  rpc ConfigureKeyring(ConfigureKeyringRequest) returns (ConfigureKeyringResponse);
  rpc RotateKeyring(RotateKeyringRequest) returns (RotateKeyringResponse);
}
